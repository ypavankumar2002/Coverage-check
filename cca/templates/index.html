{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coverage Check</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background-color: #c5c4ee;
      font-family: 'Segoe UI', sans-serif;
    }
    .nicsan-box {
      max-width: 480px;
      margin: 40px auto;
      padding: 24px;
      background-color: #ebe1e1;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-top: 4px solid #004E98;
    }
    .btn-primary {
      background-color: #004E98;
      border-color: #004E98;
    }
    .btn-primary:hover {
      background-color: #003670;
    }
    .btn-danger {
      background-color: #D7263D;
      border-color: #D7263D;
    }
    .btn-danger:hover {
      background-color: #b61f32;
    }
    #anime{
      animation-name: pic;
      animation-duration: 3s;
      animation-iteration-count: infinite;
     
    }

    @keyframes pic{
      0%{
        
        border: 2px solid rgb(117, 234, 59);
    }
    10%{
        border: 2px solid gold;
    }
    20%{
        border: 2px solid green;
    }
    30%{
        border: 2px solid red;
    }
    40%{
        border: 2px solid aqua;
    }
    50%{
        border: 2px solid yellow;
    }
    60%{
        border: 2px solid pink;
    }
    100%{
        border: 2px solid yellow;
    }
    }
  </style>
</head>
<body>
    <div class="container">
    <div class="nicsan-box">
      <div class="text-center mb-3" id="anime" style="border: 2px solid yellow; background-color:#D7263D;
      border-radius: 30px;">
        <img src="{% static 'logojpg.jpg' %}" alt="Logo" width="200px" height="40px">
      </div>
      <h2 class="text-center text-primary mb-4">Coverage Check 💡</h2>

      <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="mb-3">
          <label for="age" class="form-label">Age</label>
          <input type="number" class="form-control" id="age" name="age" required>
        </div>

        <div class="mb-3">
          <label for="city" class="form-label">City</label>
          <input type="text" class="form-control" id="city" name="city" required>
        </div>

        <div class="mb-3">
          <label for="income" class="form-label">Annual Income (₹)</label>
          <input type="number" class="form-control" id="income" name="income" required>
        </div>

        <div class="mb-3">
          <label for="dependents" class="form-label">Number of Dependents</label>
          <input type="number" class="form-control" id="dependents" name="dependents" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Get Recommendation</button>
      </form>

      {% if result %}
      <div class="mt-4 pt-3 border-top">
        <h5 class="text-danger">Recommended Health Cover: ₹{{ result.cover }}</h5>
        <p>Monthly Premium: ₹{{ result.premium }}</p>
        <button class="btn btn-danger w-100 mt-3">WhatsApp Quote 📱</button>
      </div>
      {% endif %}
    </div>
  </div>
</body>

</html>
